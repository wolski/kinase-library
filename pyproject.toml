[project]
name = "kinase-library"
version = "1.0.0"
description = "The Kinase Library Project: a Global Atlas of the Human Protein Kinome"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-SA-3.0" }
authors = [
    { name = "yaront", email = "tmy2110@cumc.columbia.edu" },
    { name = "harinlee0803", email = "harin.lee@cellsignal.com" },
    { name = "sean-landry", email = "sean.landry@cellsignal.com" },
    { name = "wolski", email = "witold.wolski@fgcz.uzh.ch" },
]
keywords = [
    "kinase",
    "phosphorylation",
    "phosphoproteomics",
    "kinase enrichment",
]
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scipy",
    "natsort",
    "tqdm",
    "pyarrow",
    "biopython",
    "gseapy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "statsmodels",
    "adjustText",
    "cyclopts",
]

[project.urls]
Documentation = "https://wolski.github.io/kinase-library/"
Homepage = "https://kinase-library.phosphosite.org"
Source = "https://github.com/wolski/kinase-library"
Issues = "https://github.com/wolski/kinase-library/issues"

[project.scripts]
scan-motifs = "kinase_library.scripts.scan_motifs_cli:app"
run-mea = "kinase_library.scripts.run_mea_cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "twine>=6,<7",
]
docs = [
    "pymdown-extensions>=11,<12",
    "zensical==0.0.43",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
